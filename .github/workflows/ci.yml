name: FastCGI Client CI PHP 8.0 - 8.5

on:
  push:
    branches:
      - master
      - development

    tags:
      - 'v*.*.*'

  pull_request:

  schedule:
    - cron: "7 7 * * *"

jobs:
  coding-standard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Pull docker services
        run: make dcpull

      - name: Install tools
        run: make install-composer

      - name: Composer update
        run: make composer-update

      - name: Run PHP_CodeSniffer
        run: make -s phpcs

  static-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@v7

      - name: Pull docker services
        run: make dcpull

      - name: Install tools
        run: make install-composer

      - name: Composer validate
        run: make composer-validate

      - name: Composer update
        run: make composer-update

      - name: Run PHPStan on PHP ${{ matrix.php }}
        run: make -s "phpstan-php-${{ matrix.php }}"

  tests:
    needs:
      - coding-standard
      - static-analysis

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@v7

      - name: Pull docker services
        run: make dcpull

      - name: Install tools
        run: make install-composer

      - name: Build environment
        run: make composer-update

      - name: Pull extension installer
        run: make pull-extension-installer

      - name: Configure PHPUnit matchers
        uses: mheap/phpunit-matcher-action@v1

      - name: Run unit tests on PHP ${{ matrix.php }}
        run: make -s -e "test-php-${{ matrix.php }}"
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1

  compatibility-servers:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}

    steps:
      - uses: actions/checkout@v7

      # Every directory with a Dockerfile in .docker/compatibility is a FastCGI server to check
      - name: List FastCGI servers
        id: list
        run: |
          SERVERS=$(ls .docker/compatibility/*/Dockerfile | xargs -n1 dirname | xargs -n1 basename | jq -R . | jq -sc .)

          echo $SERVERS
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"

  # Runs parallel to the tests. The release does not depend on it.
  compatibility:
    needs:
      - coding-standard
      - static-analysis
      - compatibility-servers

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.compatibility-servers.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Pull docker services
        run: make dcpull

      - name: Install tools
        run: make install-composer

      - name: Build environment
        run: make composer-update

      - name: Pull extension installer
        run: make pull-extension-installer

      - name: Run compatibility tests against FastCGI server ${{ matrix.server }}
        run: make -s "test-compatibility-${{ matrix.server }}"
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1

  release:
    needs:
      - coding-standard
      - static-analysis
      - tests

    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: data
        run: |
          # Strip git ref prefix from version
          RELEASE_VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && RELEASE_VERSION=$(echo $RELEASE_VERSION | sed -e 's/^v//')

          echo $RELEASE_VERSION
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Version ${{ steps.data.outputs.version }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}